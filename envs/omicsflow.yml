# =============================================================================
# envs/omicsflow.yml — Pinned Conda Environment for OmicsFlow Pipeline
# =============================================================================
#
# USAGE:
#   conda env create -f envs/omicsflow.yml
#   conda activate omicsflow
#
# PINNING STRATEGY:
#   - R base and Bioconductor are pinned to major.minor for stability
#   - Critical ML packages are pinned to exact versions
#   - Bioconductor packages follow the 3.20 release train (R 4.4.x)
#
# =============================================================================

name: omicsflow

channels:
  - conda-forge
  - bioconda
  - r
  - defaults

dependencies:
  # --- R Base (pinned to 4.4.x for Bioconductor 3.20 compatibility) ---
  - r-base=4.4.*

  # --- CRAN: Core Utilities ---
  - r-optparse>=1.7.3
  - r-jsonlite>=1.8.7
  - r-data.table>=1.15.0
  - r-matrixstats>=1.2.0
  - r-stringr>=1.5.1
  - r-dplyr>=1.1.4
  - r-tidyr>=1.3.0
  - r-tibble>=3.2.1
  - r-scales>=1.3.0
  - r-rcolorbrewer>=1.1_3
  - r-pheatmap>=1.0.12

  # --- CRAN: Visualization ---
  - r-ggplot2>=3.4.4
  - r-ggrepel>=0.9.4
  - r-cowplot>=1.1.2

  # --- CRAN: ML & Survival (pinned for reproducibility) ---
  - r-survival>=3.5_7
  - r-caret>=6.0_94
  - r-glmnet>=4.1_8
  - r-xgboost>=2.0.0
  - r-randomforestsrc>=3.2.2

  # --- Bioconductor: Core Genomics ---
  - bioconductor-summarizedexperiment>=1.36.0
  - bioconductor-edger>=4.4.0
  - bioconductor-limma>=3.62.0
  - bioconductor-sva>=3.54.0
  - bioconductor-impute>=1.80.0

  # --- Bioconductor: Methylation ---
  - bioconductor-illuminahumanmethylation450kanno.ilmn12.hg19>=0.6.1

  # --- Bioconductor: Genomic Ranges ---
  - bioconductor-genomicranges>=1.58.0
  - bioconductor-iranges>=2.40.0
  - bioconductor-genomeinfodb>=1.42.0
  - bioconductor-biomart>=2.62.0

  # --- Bioconductor: Integration (MOFA2) ---
  - bioconductor-mofa2>=1.16.0
  - bioconductor-rhdf5>=2.50.0

  # --- Bioconductor: Mutations ---
  - bioconductor-maftools>=2.22.0

  # --- Bioconductor: Enrichment ---
  - bioconductor-clusterprofiler>=4.14.0
  - bioconductor-org.hs.eg.db>=3.20.0
  - bioconductor-enrichplot>=1.26.0
  - bioconductor-dose>=4.0.0
  - bioconductor-annotationdbi>=1.68.0

  # --- Python (for MOFA2 mofapy2 backend) ---
  - python>=3.10
  - pip

  # --- Nextflow Runtime ---
  - nextflow>=23.04
  - openjdk>=11

  # --- pip sub-dependencies ---
  - pip:
    - mofapy2==0.7.1
